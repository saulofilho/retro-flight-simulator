<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002b66" />
      <stop offset="100%" stop-color="#00071a" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Wireframe perspective terrain grid in background -->
  <path d="M 6 46 L 58 46 M 12 52 L 52 52 M 20 58 L 44 58" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35" />
  <path d="M 32 40 L 4 60 M 32 40 L 18 60 M 32 40 L 46 60 M 32 40 L 60 60" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35" />

  <!-- Retro Flight HUD reticle / Pitch ladder -->
  <circle cx="32" cy="28" r="18" fill="none" stroke="#00ff66" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.4" />
  <line x1="8" y1="28" x2="18" y2="28" stroke="#00ff66" stroke-width="1.5" stroke-linecap="round" />
  <line x1="46" y1="28" x2="56" y2="28" stroke="#00ff66" stroke-width="1.5" stroke-linecap="round" />

  <!-- Retro Vector Jet Fighter Icon (Wireframe Vector Jet) -->
  <g filter="url(#neonGlow)">
    <!-- Wings & Body outline -->
    <polygon points="32,9 39,26 55,33 51,36 38,35 34,44 32,42 30,44 26,35 13,36 9,33 25,26" 
             fill="#00182b" stroke="#00ff88" stroke-width="1.8" stroke-linejoin="round" />
    
    <!-- Fuselage center spine -->
    <line x1="32" y1="11" x2="32" y2="40" stroke="#00ffff" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Wing sweep internal wireframe struts -->
    <line x1="32" y1="22" x2="48" y2="33" stroke="#00ffff" stroke-width="1" stroke-opacity="0.8" />
    <line x1="32" y1="22" x2="16" y2="33" stroke="#00ffff" stroke-width="1" stroke-opacity="0.8" />

    <!-- Jet thruster engine glow -->
    <polygon points="30,43 32,50 34,43" fill="#ffaa00" stroke="#ff3300" stroke-width="0.8" />
  </g>

  <!-- Crosshair dot -->
  <circle cx="32" cy="28" r="1.5" fill="#00ff66" />
</svg>
